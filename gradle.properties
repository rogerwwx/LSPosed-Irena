## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AGP 9.x embeds Kotlin 2.2.10 for built-in Kotlin compilation, which cannot
# read the Kotlin 2.4.0 metadata of miuix 0.9.3. Opt out and apply
# org.jetbrains.kotlin.android explicitly so the module compiles with KGP
# 2.4.10. (This opt-out is deprecated upstream and removed in AGP 10 - when
# an AGP release ships a built-in Kotlin >= 2.3 this flag can be dropped and
# miuix upgraded in lockstep.)
android.builtInKotlin=false
# KGP 2.4.10 still casts AGP's extension to the old BaseExtension, so the
# built-in-Kotlin opt-out above only works with the classic DSL as well.
# Both flags are temporary: drop them once an AGP release embeds Kotlin >= 2.3.
android.newDsl=false
